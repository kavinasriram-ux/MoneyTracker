<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bambu Lab A1 Savings Tracker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding: 2rem; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 480px; padding: 2rem; text-align: center; }
    .progress-container { background: #e2e8f0; border-radius: 999px; height: 24px; overflow: hidden; margin: 1.5rem 0; }
    .progress-bar { background: #00ae42; height: 100%; width: 0%; transition: width 0.4s ease; }
    .inputs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
    input { padding: 0.6rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; width: 140px; }
    button { background: #00ae42; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #008f36; }
    .history { text-align: left; max-height: 180px; overflow-y: auto; font-size: 0.9rem; border-top: 1px solid #e2e8f0; padding-top: 1rem; }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your actual Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDvfQonm8IVTruDwD-dbk0ms3pnqMWG28E",
      authDomain: "a1-savings-tracker.firebaseapp.com",
      projectId: "a1-savings-tracker",
      storageBucket: "a1-savings-tracker.firebasestorage.app",
      messagingSenderId: "157604988608",
      appId: "1:157604988608:web:069538e4dfbfa3c9010f25"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const TARGET_PRICE = 399.00; // Target price for Bambu Lab A1
    const trackerDocRef = doc(db, "printers", "bambu_a1_tracker");

    let currentUser = null;

    // UI Elements
    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userLabel = document.getElementById("userLabel");

    loginBtn.onclick = () => signInWithPopup(auth, provider);
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authSection.style.display = "none";
        appSection.style.display = "block";
        userLabel.innerText = `Signed in as: ${user.displayName}`;
      } else {
        authSection.style.display = "block";
        appSection.style.display = "none";
      }
    });

    // Realtime Firestore Listener
    onSnapshot(trackerDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const total = data.totalSaved || 0;
        document.getElementById("totalSaved").innerText = `$${total.toFixed(2)}`;
        const percent = Math.min((total / TARGET_PRICE) * 100, 100);
        document.getElementById("progressBar").style.width = `${percent}%`;
        document.getElementById("percentLabel").innerText = `${percent.toFixed(1)}% of $${TARGET_PRICE}`;

        const logList = document.getElementById("logList");
        logList.innerHTML = (data.logs || []).slice(-5).reverse().map(l => 
          `<div><b>${l.name}</b> added $${l.amount.toFixed(2)} on ${new Date(l.date).toLocaleDateString()}</div>`
        ).join("");
      }
    });

    // Add Money
    document.getElementById("addBtn").onclick = async () => {
      const input = document.getElementById("amountInput");
      const amount = parseFloat(input.value);
      if (!amount || amount <= 0) return;

      await setDoc(trackerDocRef, {
        totalSaved: increment(amount),
        logs: arrayUnion({
          name: currentUser.displayName,
          amount: amount,
          date: new Date().toISOString()
        })
      }, { merge: true });

      input.value = "";
    };
  </script>
</head>
<body>
  <div class="card">
    <h2>Bambu Lab A1 Fund</h2>

    <div id="authSection">
      <p>Sign in with your Google account to contribute:</p>
      <button id="loginBtn">Sign in with Google</button>
    </div>

    <div id="appSection" style="display:none;">
      <p id="userLabel" style="font-size: 0.85rem; color: #64748b;"></p>
      <h1 id="totalSaved">$0.00</h1>
      <p id="percentLabel" style="font-weight: 500; color: #334155;">0% of $399.00</p>
      
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="inputs">
        <input type="number" id="amountInput" placeholder="Amount ($)" step="0.50" min="0" />
        <button id="addBtn">Add to Savings</button>
      </div>

      <div class="history">
        <strong>Recent Contributions:</strong>
        <div id="logList"></div>
      </div>
      <br/>
      <button id="logoutBtn" style="background:#ef4444; font-size: 0.8rem; padding: 0.3rem 0.8rem;">Sign Out</button>
    </div>
  </div>
</body>
</html>
